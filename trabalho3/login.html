<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JulinhaFlix</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body class="pagina-catalogo">

    <header id="cabecalho-principal">
        <img src="../imagens/icon.png" alt="Ícone do catálogo">
        <h1>Catálogo de Filmes Julia</h1>
    </header>

    <nav class="navbar" aria-label="Navegação principal">
        <a href="trabalho3.html">Início</a>
        <a href="serie.html">Séries</a>
        <a href="filme.html">Filmes</a>
        <a href="desenho.html">Desenhos</a>
        <a href="login.html" aria-current="page">Login</a>
        <a href="../atividades.html">Voltar para Atividades</a>
    </nav>

    <main class="login-container">

        <h1>Entrar</h1>

        <form class="login-form">

            <div class="form-group">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="btn-atv1">
                Entrar
            </button>

        </form>

    </main>

    <footer id="rodape">
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
